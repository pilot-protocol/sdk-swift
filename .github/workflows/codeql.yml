name: "CodeQL"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 6 AM UTC

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    # Swift CodeQL extraction only runs on macOS — the GitHub-hosted
    # ubuntu runners refuse with "Swift analysis is only supported on
    # macOS runner images. Please migrate to a macOS runner." Stays on
    # the same -latest tag so the runner image moves forward with us.
    runs-on: macos-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: swift
      # CodeQL's swift autobuild invokes swiftc directly without
      # running `swift package resolve` first, so any package with
      # `.binaryTarget` deps (we have one — PilotC, the XCFramework)
      # blows up with `error: no such module 'PilotC'`. Replace
      # autobuild with the same `swift build` the ci.yml test job
      # already runs successfully — it resolves the manifest, fetches
      # the binary artifact, and produces an indexable build that
      # the extractor can attach to.
      - name: Build (resolves binaryTarget, autobuild can't)
        run: swift build
      - uses: github/codeql-action/analyze@v3
