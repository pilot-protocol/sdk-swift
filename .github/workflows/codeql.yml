name: "CodeQL"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 6 AM UTC

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    # Swift CodeQL extraction only runs on macOS — the GitHub-hosted
    # ubuntu runners refuse with "Swift analysis is only supported on
    # macOS runner images. Please migrate to a macOS runner." Stays on
    # the same -latest tag so the runner image moves forward with us.
    runs-on: macos-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: swift
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
