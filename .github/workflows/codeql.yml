name: "CodeQL"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 6 AM UTC

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    # Swift CodeQL extraction only runs on macOS — the GitHub-hosted
    # ubuntu runners refuse with "Swift analysis is only supported on
    # macOS runner images. Please migrate to a macOS runner." Stays on
    # the same -latest tag so the runner image moves forward with us.
    runs-on: macos-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      # Download the .binaryTarget XCFramework (PilotC) BEFORE CodeQL
      # inserts its build tracer. With the tracer hooked first, swift
      # downloads the artifact but can't see the resulting module on
      # its search path during compilation and fails with
      # `error: no such module 'PilotC'`. Pre-resolving outside the
      # tracer puts the artifact on disk so the subsequent swift build
      # is a no-op resolve + observed compile.
      - name: Resolve package dependencies (pre-tracer)
        run: swift package resolve

      - uses: github/codeql-action/init@v3
        with:
          languages: swift

      - name: Build (observed by CodeQL tracer)
        run: swift build

      - uses: github/codeql-action/analyze@v3
